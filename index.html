<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katkaise tartuntaketju</title><style>
:root{--bg:#07111f;--panel:#102238;--panel2:#142b43;--text:#f4f8fc;--muted:#bdd0e0;--accent:#9b87ff;--cyan:#62d8ff;--good:#55d990;--warn:#ffd166;--bad:#ff7373}*{box-sizing:border-box}html{font-size:18px}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#24335a,#0b1b30 42%,#07111f 78%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.48}button{font:inherit}main{width:min(1000px,calc(100% - 24px));margin:auto;padding:22px 0 48px}.series{font-size:.78rem;letter-spacing:.1em;color:#d0c8ff;font-weight:800}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}.game{font-weight:850}.progress{color:var(--muted)}.bar{height:10px;background:#263c53;border-radius:999px;overflow:hidden;margin:12px 0 18px}.bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .25s}.card{background:rgba(16,34,56,.97);border:1px solid #405e7d;border-radius:18px;padding:clamp(18px,3vw,32px);box-shadow:0 18px 55px #0008}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.05;margin:.3em 0}h2{font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.2;margin:.2em 0}.lead{font-size:1.13rem;color:#e4ecf8}.badge{display:inline-block;border:1px solid #8f7ce7;border-radius:999px;padding:4px 11px;color:#e1dcff;font-size:.84rem;font-weight:750}.scenario{background:#f6f8fb;color:#14202d;border-radius:12px;padding:17px;margin:16px 0;box-shadow:inset 5px 0 var(--accent)}.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.goal{background:var(--panel2);border:1px solid #466681;border-radius:10px;padding:9px;font-size:.86rem}.goal.done{border-color:var(--good);color:#dfffee}.board{position:relative;min-height:460px;background:linear-gradient(135deg,#0a1729,#101f39);border:1px solid #486886;border-radius:16px;margin:16px 0;overflow:hidden}.edge{position:absolute;height:14px;transform-origin:left center;z-index:1;border:0;background:transparent;padding:0;cursor:pointer}.edge::before{content:"";position:absolute;left:0;right:0;top:5px;height:4px;border-radius:5px;background:#6685a1}.edge:hover::before,.edge:focus-visible::before{background:var(--cyan);box-shadow:0 0 0 5px #62d8ff33}.edge.cut::before{background:#5b6570}.edge.cut::after{content:"✕";position:absolute;left:50%;top:-11px;transform:translateX(-50%);color:var(--bad);font-size:1.6rem;font-weight:900;text-shadow:0 1px 4px #000}.edge.required-open::before{background:var(--bad);box-shadow:0 0 9px #ff737377}.node{position:absolute;z-index:2;width:138px;min-height:96px;transform:translate(-50%,-50%);border:3px solid #6686a5;background:#17324f;color:#fff;border-radius:15px;padding:9px;text-align:center;font-weight:800;cursor:pointer}.node:hover,.node:focus-visible{outline:3px solid #62d8ff55;outline-offset:2px;border-color:var(--cyan)}.node .icon{display:block;font-size:1.7rem}.node .state{display:block;font-size:.72rem;margin-top:4px;color:#d7e5f0}.node.infected{border-color:var(--bad);background:#512b3c}.node.risk{border-color:var(--warn)}.node.isolated{border-color:var(--good);background:#17443b;box-shadow:0 0 0 5px #55d99022}.node.removed{opacity:.55;transform:translate(-50%,-50%) rotate(-5deg)}.support{position:absolute;right:15px;bottom:15px;z-index:4;border:2px solid #718dab;background:#17304b;color:#fff;border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:800}.support.done{border-color:var(--good);background:#17443b}.prompt{background:#eaf7ff;color:#102238;border:3px solid var(--cyan);border-radius:14px;padding:12px 15px;margin:12px 0}.prompt b{display:block}.toast{background:#172f48;border-left:6px solid var(--good);border-radius:9px;padding:12px 15px;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{flex:1 1 220px;border-radius:12px;padding:14px 16px;font-weight:850;cursor:pointer}.primary{border:2px solid #baaefe;background:#6652c5;color:#fff}.secondary{border:2px solid #567492;background:transparent;color:#fff}.primary:hover,.primary:focus-visible,.secondary:hover,.secondary:focus-visible,.support:hover,.support:focus-visible{outline:3px solid #62d8ff55;outline-offset:2px;border-color:var(--cyan)}.feedback{background:#172f48;border-left:6px solid var(--warn);padding:17px;border-radius:9px;margin:18px 0}.feedback.good{border-color:var(--good)}.feedback.bad{border-color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.summary div{background:var(--panel2);border:1px solid #405f7b;border-radius:12px;padding:15px}.note{color:var(--muted);font-size:.92rem}.modal{position:fixed;inset:0;z-index:20;background:#000b;display:grid;place-items:center;padding:20px}.dialog{width:min(500px,100%);background:#102238;border:2px solid #6688a5;border-radius:16px;padding:22px;box-shadow:0 20px 70px #000}.dialog h3{margin-top:0}.hidden{display:none}@media(max-width:720px){html{font-size:16px}.board{min-height:500px}.node{width:112px;min-height:84px}.goals{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}@media(max-width:430px){.node{width:96px;font-size:.88rem}.board{min-height:520px}.support{right:8px;bottom:8px}}
</style></head><body><main><div class="series">KYBERTURVALLISUUDEN UHKAPOLKU</div><div class="top"><div class="game">KATKAISE TARTUNTAKETJU</div><div id="progressText" class="progress"></div></div><div class="bar"><div id="progressBar"></div></div><section id="app" class="card" aria-live="polite"></section></main><div id="modal" class="modal hidden"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="actions"><button class="secondary" id="cancel">Peruuta</button><button class="primary" id="confirm">Vahvista</button></div></div></div><script>
const scenarios=[
{name:'Muistitikku',text:'Kannettavalla on haitallinen tiedosto. Muistitikku on kiinni kannettavassa ja aiotaan siirtää toiselle koneelle.',nodes:[['laptop','Kannettava','💻',24,48,'infected','isolate'],['usb','Muistitikku','🔌',51,48,'risk','remove'],['pc','Toinen kone','🖥️',78,48,'safe',null]],edges:[['laptop','usb',1],['usb','pc',0]],report:false,tip:'Eristä kannettava ja irrota muistitikku.'},
{name:'Pilvisynkronointi',text:'Kannettavan tiedostojen nimet muuttuvat. Kannettava synkronoi yhteiseen pilvikansioon.',nodes:[['laptop','Kannettava','💻',24,62,'infected','isolate'],['cloud','Pilvikansio','☁️',52,30,'risk',null],['pc','Toinen kone','🖥️',80,62,'safe',null]],edges:[['laptop','cloud',1],['cloud','pc',0]],report:true,tip:'Katkaise kannettavan pilviyhteys, eristä laite ja ilmoita IT-tuelle.'},
{name:'Yhteinen tiedosto',text:'Haitallinen tiedosto avattiin kahdella koneella yhteisestä kansiosta.',nodes:[['pc1','Kone 1','💻',24,65,'infected','isolate'],['cloud','Yhteinen kansio','☁️',51,30,'risk',null],['pc2','Kone 2','🖥️',78,65,'infected','isolate']],edges:[['pc1','cloud',1],['cloud','pc2',1]],report:true,tip:'Eristä molemmat koneet, katkaise niiden yhteydet ja ilmoita.'},
{name:'Puhelin ja koulun kone',text:'Puhelimessa on epäilyttävä tiedosto. Puhelin on yhdistetty koulun tietokoneeseen USB-kaapelilla.',nodes:[['phone','Puhelin','📱',27,48,'risk','isolate'],['cable','USB-kaapeli','🔌',51,48,'risk','remove'],['pc','Koulun kone','🖥️',76,48,'safe',null]],edges:[['phone','cable',1],['cable','pc',0]],report:false,tip:'Irrota USB-kaapeli ja pidä puhelin erossa koulun koneesta.'},
{name:'Varmuuskopio vaarassa',text:'Kannettava muuttaa tiedostoja. Ulkoinen varmuuskopiolevy on kiinni ja verkkoyhteys on päällä.',nodes:[['laptop','Kannettava','💻',24,53,'infected','isolate'],['drive','Varmuuskopiolevy','💾',52,72,'risk','remove'],['cloud','Verkko','🌐',52,25,'risk',null],['pc','Toinen kone','🖥️',80,25,'safe',null]],edges:[['laptop','drive',1],['laptop','cloud',1],['cloud','pc',0]],report:true,tip:'Irrota varmuuskopiolevy, katkaise verkko, eristä kannettava ja ilmoita.'},
{name:'Luokan laiteverkko',text:'Yksi kannettava muuttaa tiedostoja. Se on yhteydessä pilveen, muistitikkuun ja tulostimeen. Pilveä käyttää myös toinen kone.',nodes:[['laptop','Kannettava','💻',20,55,'infected','isolate'],['cloud','Pilvikansio','☁️',48,25,'risk',null],['usb','Muistitikku','🔌',48,55,'risk','remove'],['printer','Tulostin','🖨️',48,82,'safe',null],['pc','Toinen kone','🖥️',80,25,'safe',null]],edges:[['laptop','cloud',1],['laptop','usb',1],['laptop','printer',0],['cloud','pc',0]],report:true,tip:'Eristä kannettava, katkaise pilviyhteys, irrota muistitikku ja ilmoita. Tulostinyhteyttä ei tarvitse katkaista.'}];
let state={i:-1,score:0,nodeStates:{},cut:new Set(),reported:false,toast:'',focus:null};const app=document.getElementById('app'),modal=document.getElementById('modal');
function header(){const p=state.i<0?0:state.i>=scenarios.length?100:(state.i/scenarios.length)*100;document.getElementById('progressBar').style.width=p+'%';document.getElementById('progressText').textContent=state.i<0?'6 tasoa':state.i<scenarios.length?`Taso ${state.i+1}/${scenarios.length}`:'Yhteenveto'}
function intro(){header();app.innerHTML=`<span class="badge">SUORA TOIMINTA</span><h1>Katkaise tartuntaketju</h1><p class="lead">Toimi suoraan laiteverkossa.</p><div class="prompt"><b>Näin pelaat</b>Paina yhteysviivaa katkaistaksesi yhteyden. Paina muistitikun tai USB-kaapelin kuvaketta irrottaaksesi sen. Paina saastunutta laitetta eristääksesi sen.</div><p>Kun tilanne näyttää turvalliselta, paina <b>Tarkista tilanne</b>. Voit korjata avoimet riskit ennen seuraavaan tasoon siirtymistä.</p><button class="primary" onclick="start(0)">Aloita peli</button>`}
function start(i){state.i=i;state.cut=new Set();state.reported=false;state.toast='Paina laitetta tai yhteysviivaa.';state.nodeStates={};scenarios[i].nodes.forEach(n=>state.nodeStates[n[0]]=n[5]);header();render()}
function key(a,b){return [a,b].sort().join('|')}
function goals(){const s=scenarios[state.i],requiredEdges=s.edges.filter(e=>e[2]),edgesDone=requiredEdges.every(e=>state.cut.has(key(e[0],e[1]))),nodesDone=s.nodes.filter(n=>n[6]).every(n=>state.nodeStates[n[0]]===(n[6]==='remove'?'removed':'isolated')),reportDone=!s.report||state.reported;return {edgesDone,nodesDone,reportDone,all:edgesDone&&nodesDone&&reportDone}}
function render(){const s=scenarios[state.i],g=goals();app.innerHTML=`<span class="badge">TASO ${state.i+1}</span><h2>${s.name}</h2><div class="scenario">${s.text}</div><div class="goals"><div class="goal ${g.nodesDone?'done':''}">${g.nodesDone?'✓':'○'} Laitteet turvattu</div><div class="goal ${g.edgesDone?'done':''}">${g.edgesDone?'✓':'○'} Leviämisreitit katkaistu</div><div class="goal ${g.reportDone?'done':''}">${g.reportDone?'✓':'○'} ${s.report?'IT-tuelle ilmoitettu':'Ilmoitusta ei tarvita'}</div></div><div id="board" class="board">${s.edges.map((e,i)=>drawEdge(e,i)).join('')}${s.nodes.map(drawNode).join('')}<button class="support ${state.reported?'done':''}" id="support" ${!s.report||state.reported?'disabled':''}>${state.reported?'✓ Ilmoitettu':'📣 Ilmoita IT-tuelle'}</button></div>${state.toast?`<div class="toast">${state.toast}</div>`:''}<div class="actions"><button class="secondary" id="reset">Palauta taso</button><button class="primary" id="check">Tarkista tilanne</button></div><p class="note">Paina suoraan kohdetta. Katkaistun yhteyden päälle tulee rasti.</p>`;positionEdges();document.querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>askEdge(+b.dataset.edge));document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>askNode(b.dataset.node));document.getElementById('support').onclick=askReport;document.getElementById('reset').onclick=()=>start(state.i);document.getElementById('check').onclick=check}
function drawNode(n){const [id,name,icon,x,y]=n,st=state.nodeStates[id];return `<button class="node ${st}" data-node="${id}" style="left:${x}%;top:${y}%"><span class="icon">${icon}</span>${name}<span class="state">${label(st,n[6])}</span></button>`}
function label(st,action){if(st==='isolated')return 'Eristetty';if(st==='removed')return 'Irrotettu';if(st==='infected')return 'Haitallinen toiminta';if(st==='risk')return action==='remove'?'Paina ja irrota':'Vaarassa';return 'Turvallinen'}
function drawEdge(e,i){const cut=state.cut.has(key(e[0],e[1]));return `<button class="edge ${cut?'cut':''}" data-edge="${i}" aria-label="${cut?'Palauta':'Katkaise'} yhteys"></button>`}
function positionEdges(){const s=scenarios[state.i],board=document.getElementById('board');if(!board)return;const r=board.getBoundingClientRect();s.edges.forEach((e,i)=>{const a=s.nodes.find(n=>n[0]===e[0]),b=s.nodes.find(n=>n[0]===e[1]),x1=a[3]/100*r.width,y1=a[4]/100*r.height,x2=b[3]/100*r.width,y2=b[4]/100*r.height,el=board.querySelector(`[data-edge="${i}"]`),len=Math.hypot(x2-x1,y2-y1),ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;el.style.left=x1+'px';el.style.top=(y1-7)+'px';el.style.width=len+'px';el.style.transform=`rotate(${ang}deg)`})}
window.addEventListener('resize',positionEdges);
function showModal(title,text,confirm,yes='Vahvista'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;document.getElementById('confirm').textContent=yes;modal.classList.remove('hidden');document.getElementById('cancel').onclick=()=>modal.classList.add('hidden');document.getElementById('confirm').onclick=()=>{modal.classList.add('hidden');confirm()};document.getElementById('confirm').focus()}
function askEdge(i){const e=scenarios[state.i].edges[i],k=key(e[0],e[1]),a=name(e[0]),b=name(e[1]);if(state.cut.has(k)){showModal('Palautetaanko yhteys?',`${a} ja ${b} yhdistetään uudelleen.`,()=>{state.cut.delete(k);state.toast='Yhteys palautettiin.';render()},'Palauta')}else showModal('Katkaistaanko yhteys?',`${a} ↔ ${b}`,()=>{state.cut.add(k);state.toast=`Yhteys katkesi: ${a} ↔ ${b}.`;render()},'Katkaise')}
function askNode(id){const n=scenarios[state.i].nodes.find(x=>x[0]===id),action=n[6],st=state.nodeStates[id];if(!action){state.toast=`${n[1]} ei tarvitse suoraa toimenpidettä tässä tilanteessa.`;render();return}if(st==='isolated'||st==='removed'){state.toast=`${n[1]} on jo ${st==='isolated'?'eristetty':'irrotettu'}.`;render();return}if(action==='remove')showModal(`Irrotetaanko ${n[1].toLowerCase()}?`,'Yhteys muihin laitteisiin katkeaa.',()=>{state.nodeStates[id]='removed';cutAll(id);state.toast=`${n[1]} irrotettiin.`;render()},'Irrota');else showModal(`Eristetäänkö ${n[1].toLowerCase()}?`,'Kaikki laitteen yhteydet katkeavat.',()=>{state.nodeStates[id]='isolated';cutAll(id);state.toast=`${n[1]} eristettiin.`;render()},'Eristä')}
function cutAll(id){scenarios[state.i].edges.filter(e=>e.includes(id)).forEach(e=>state.cut.add(key(e[0],e[1])))}
function askReport(){showModal('Ilmoitetaanko IT-tuelle?','IT-tuki saa tiedon haittaohjelmaepäilystä.',()=>{state.reported=true;state.toast='IT-tuelle ilmoitettiin.';render()},'Ilmoita')}
function name(id){return scenarios[state.i].nodes.find(n=>n[0]===id)[1]}
function check(){const g=goals(),s=scenarios[state.i];if(g.all){state.score++;app.innerHTML=`<span class="badge">TASO SELVITETTY</span><h2>Tilanne hallinnassa</h2><div class="feedback good"><p>Tarvittavat laitteet eristettiin ja leviämisreitit katkaistiin.</p><p><b>Ratkaisu:</b> ${s.tip}</p></div><button class="primary" onclick="${state.i<scenarios.length-1?`start(${state.i+1})`:'finish()'}">${state.i<scenarios.length-1?'Seuraava taso':'Näytä yhteenveto'}</button>`}else{let missing=[];if(!g.nodesDone)missing.push('jokin laite tai irrotettava väline on vielä turvaamatta');if(!g.edgesDone)missing.push('jokin leviämisreitti on vielä avoinna');if(!g.reportDone)missing.push('IT-tuelle ei ole ilmoitettu');state.toast='Tarkista vielä: '+missing.join(', ')+'.';render()}}
function finish(){state.i=scenarios.length;header();document.getElementById('progressBar').style.width='100%';app.innerHTML=`<h2>Peli päättyi</h2><p class="lead">Selvitit kaikki kuusi tartuntatilannetta.</p><div class="summary"><div>Selvitetyt tasot<br><b>${state.score}/6</b></div><div>Pelatut tilanteet<br><b>6/6</b></div></div><h3>Muista toimintamalli</h3><ol><li><b>Eristä</b> haitallisesti toimiva laite.</li><li><b>Katkaise</b> tiedostoja siirtävät yhteydet.</li><li><b>Irrota</b> muistitikku tai varmuuskopiolevy.</li><li><b>Ilmoita</b> opettajalle tai IT-tuelle.</li></ol><button class="primary" onclick="start(0)">Pelaa uudelleen</button>`}
intro();
</script></body></html>
